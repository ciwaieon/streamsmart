{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="caixa-auth">
  <h1>Criar conta</h1>
  <form method="post" class="formulario">
    <label>Nome <input type="text" name="nome" value="{{ nome or '' }}" required autofocus></label>
    <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required></label>
    <label>Senha <input type="password" name="senha" minlength="6" required></label>
    <label>Confirmar senha <input type="password" name="confirmar" minlength="6" required></label>
    <button class="botao" type="submit">Criar conta</button>
  </form>
  <p class="links-auth">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
{% endblock %}
