{% extends "base.html" %}
{% block titulo %}Nova senha{% endblock %}
{% block conteudo %}
<div class="caixa-auth">
  <h1>Escolha uma nova senha</h1>
  <form method="post" class="formulario">
    <label>Nova senha <input type="password" name="senha" minlength="6" required autofocus></label>
    <label>Confirmar <input type="password" name="confirmar" minlength="6" required></label>
    <button class="botao" type="submit">Salvar senha</button>
  </form>
</div>
{% endblock %}
