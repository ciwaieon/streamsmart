{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="caixa-auth">
  <h1>Entrar</h1>
  <form method="post" class="formulario">
    <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Senha <input type="password" name="senha" required></label>
    <button class="botao" type="submit">Entrar</button>
  </form>
  <p class="links-auth">
    <a href="{{ url_for('recuperar') }}">Esqueci minha senha</a> ·
    <a href="{{ url_for('cadastro') }}">Criar conta</a>
  </p>
  <p class="dica">Demonstração: <code>demo@streamsmart.com</code> · senha <code>demo123</code></p>
</div>
{% endblock %}
