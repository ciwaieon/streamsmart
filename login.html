{% extends "entrada_base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block formulario %}
<h1>Entrar</h1>
<form method="post" class="formulario">
  <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email"></label>
  <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
  <button class="botao" type="submit">Entrar</button>
</form>
<p style="margin-top:1.25rem"><a href="{{ url_for('recuperar') }}">Esqueci minha senha</a></p>
<p>Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
<p class="pequeno" style="color:var(--coffee)">Demonstração: demo@streamsmart.com, senha demo123</p>
{% endblock %}
